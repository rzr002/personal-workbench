<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Personal Workbench architecture</title>
  <desc id="desc">A source IP gate gives the owner personal and team capabilities while collaborators receive approved team capabilities only.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#67e8f9"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c4b5fd"/>
    </marker>
  </defs>

  <rect width="1200" height="600" rx="28" fill="url(#background)"/>
  <circle cx="1080" cy="65" r="180" fill="#2563eb" opacity="0.12"/>
  <circle cx="90" cy="560" r="210" fill="#7c3aed" opacity="0.10"/>

  <text x="70" y="74" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="35" font-weight="700">Personal Workbench</text>
  <text x="70" y="108" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">Machine IP role gate · shared team capabilities · owner-only personal learning</text>

  <g filter="url(#shadow)">
    <rect x="65" y="165" width="300" height="330" rx="22" fill="#111827" stroke="#334155"/>
    <rect x="450" y="165" width="300" height="330" rx="22" fill="#111827" stroke="#334155"/>
    <rect x="835" y="165" width="300" height="330" rx="22" fill="#111827" stroke="#334155"/>
  </g>

  <rect x="65" y="165" width="300" height="7" rx="4" fill="url(#cyan)"/>
  <rect x="450" y="165" width="300" height="7" rx="4" fill="url(#emerald)"/>
  <rect x="835" y="165" width="300" height="7" rx="4" fill="url(#violet)"/>

  <text x="95" y="215" fill="#67e8f9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2">PUBLIC</text>
  <text x="95" y="252" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700">Plugin core</text>
  <text x="95" y="289" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Unified router</text>
  <text x="95" y="321" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Profile tooling</text>
  <text x="95" y="353" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Review workflow</text>
  <text x="95" y="385" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Privacy checks</text>
  <rect x="95" y="423" width="225" height="42" rx="11" fill="#082f49" stroke="#155e75"/>
  <text x="207" y="449" text-anchor="middle" fill="#a5f3fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Safe to share and version</text>

  <text x="480" y="215" fill="#6ee7b7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2">TEAM</text>
  <text x="480" y="252" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700">Capability packs</text>
  <text x="480" y="289" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Internal Skills and SOPs</text>
  <text x="480" y="321" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Paths, endpoints, schemas</text>
  <text x="480" y="353" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Repository or group access</text>
  <text x="480" y="385" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Content fingerprint</text>
  <rect x="480" y="423" width="225" height="42" rx="11" fill="#052e2b" stroke="#0f766e"/>
  <text x="592" y="449" text-anchor="middle" fill="#a7f3d0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Owner approves updates</text>

  <text x="865" y="215" fill="#c4b5fd" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2">PRIVATE</text>
  <text x="865" y="252" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700">Owner profile</text>
  <text x="865" y="289" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Owner IP: personal + team</text>
  <text x="865" y="321" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Other IP: team only</text>
  <text x="865" y="353" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Owner-only approvals</text>
  <text x="865" y="385" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Owner-only learning</text>
  <rect x="865" y="423" width="225" height="42" rx="11" fill="#2e1065" stroke="#6d28d9"/>
  <text x="977" y="449" text-anchor="middle" fill="#ddd6fe" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Never committed or shared</text>

  <path d="M365 330 C400 330 415 330 445 330" stroke="#67e8f9" stroke-width="3" fill="none" marker-end="url(#arrow-cyan)"/>
  <path d="M750 330 C785 330 800 330 830 330" stroke="#c4b5fd" stroke-width="3" fill="none" marker-end="url(#arrow-violet)"/>

  <rect x="264" y="528" width="672" height="40" rx="20" fill="#0f172a" stroke="#334155"/>
  <text x="600" y="553" text-anchor="middle" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">
    Detected IP → owner gets all approved scopes · collaborator gets approved team scope only
  </text>
</svg>
